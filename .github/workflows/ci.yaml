name: Customer Retention CI/CD

# Trigger automated testing on pushes and pull requests.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Retrieve the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure the Python environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install project dependencies.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Execute automated tests.
      - name: Run tests
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest

    # Build the image only after tests pass.
    needs: test

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/omesham/customer-retention-revenue-risk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build and tag the image with the commit identifier.
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      # Authenticate with GitHub Container Registry.
      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Publish images from successful branch pushes.
      - name: Publish Docker image
        if: github.event_name == 'push'
        run: docker push $IMAGE_NAME:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest

    # Update Kubernetes only after successful image publication.
    needs: docker-build

    # Deploy development branch changes only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    permissions:
      contents: write

    env:
      IMAGE_NAME: ghcr.io/omesham/customer-retention-revenue-risk

    steps:
      # Retrieve the latest development branch.
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      # Update the FastAPI deployment image.
      - name: Update Kubernetes manifest
        run: |
          set -euo pipefail

          # Prevent an older workflow from deploying outdated code.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists. Skipping deployment."
            exit 0
          fi

          sed -i "s|image: ghcr.io/omesham/customer-retention-revenue-risk:.*|image: ${IMAGE_NAME}:${GITHUB_SHA}|" k8s/fastapi.yaml

          # Verify the manifest references the published image.
          grep -F "image: ${IMAGE_NAME}:${GITHUB_SHA}" k8s/fastapi.yaml

          # Skip the commit if the manifest is unchanged.
          if git diff --quiet -- k8s/fastapi.yaml; then
            exit 0
          fi

          # Commit the updated deployment configuration.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/fastapi.yaml
          git commit -m "Deploy FastAPI image ${GITHUB_SHA}"
          git push origin HEAD:development